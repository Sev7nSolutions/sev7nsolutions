<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#21262d" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#e6edf3" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#6e7681"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="#0d1117"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>
  <rect y="190" width="1200" height="110" fill="url(#fade)"/>

  <rect width="1200" height="2" fill="#e6edf3" opacity="0.07">
    <animate attributeName="y" from="-4" to="300" dur="7s" repeatCount="indefinite"/>
  </rect>

  <g fill="none" stroke="#30363d" stroke-width="2">
    <path d="M30 60V30H60"/>
    <path d="M1170 60V30H1140"/>
    <path d="M30 240v30h30"/>
    <path d="M1170 240v30h-30"/>
  </g>

  <g font-family="'SF Mono','Consolas','Menlo','DejaVu Sans Mono',monospace">
    <text x="60" y="62" font-size="14" fill="#6e7681">~/sev7n
      <animate attributeName="opacity" values="1;1;0.4;1" dur="3s" repeatCount="indefinite"/>
    </text>

    <text x="600" y="162" font-size="96" font-weight="700" letter-spacing="14"
          text-anchor="middle" fill="url(#title)">sev7n
      <animate attributeName="opacity" from="0" to="1" dur="1.4s" fill="freeze"/>
    </text>

    <text x="600" y="206" font-size="15" letter-spacing="9"
          text-anchor="middle" fill="#8b949e">SEV7NSOLUTIONS
      <animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="1.2s" fill="freeze"/>
    </text>

    <text x="600" y="240" font-size="13" letter-spacing="3"
          text-anchor="middle" fill="#6e7681">web  /  bots  /  fivem
      <animate attributeName="opacity" from="0" to="1" begin="1s" dur="1.2s" fill="freeze"/>
    </text>
  </g>
</svg>
